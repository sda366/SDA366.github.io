/* ============================================================
   渲染
   ============================================================ */
(function(){
  var box = document.getElementById('table');
  var wordCount = 0, charCount = 0;

  GROUPS.forEach(function(g){
    var row = document.createElement('div');
    row.className = 'row';

    /* 分区徽章（换分区时在行前插一条大徽章） */
    if (g.sec){
      var sb = document.createElement('div');
      sb.className = 'secbadge';
      sb.textContent = (g.sec === 'read') ? '阅读' : '识字';
      row.appendChild(sb);
      row.appendChild(document.createElement('br'));
    }

    var line = document.createElement('div');
    line.className = 'row-line';

    /* 左列：课文序号 */
    var no = document.createElement('span');
    no.className = 'no';
    no.textContent = g.no;
    line.appendChild(no);

    /* 词格：每个词一组田字格，词间空一格字宽（CSS margin） */
    var words = document.createElement('span');
    words.className = 'words';
    g.ws.split(' ').forEach(function(w){
      wordCount++; charCount += w.length;
      var wd = document.createElement('span');
      wd.className = 'word';
      wd.title = w;
      var cells = document.createElement('span');
      cells.style.display = 'flex';
      w.split('').forEach(function(z){
        var c = document.createElement('span');
        c.className = 'wzg';
        c.innerHTML = '<b>' + z + '</b>';
        cells.appendChild(c);
      });
      wd.appendChild(cells);
      /* 点词即听：读整个词 */
      wd.onclick = function(){ speak(w); };
      words.appendChild(wd);
    });
    line.appendChild(words);
    row.appendChild(line);
    box.appendChild(row);

    /* 造句卡：本课代表词的造句 + 课文原句 */
    if (g.cz && g.cz.length){
      var cz = document.createElement('div');
      cz.className = 'cz';
      var t = document.createElement('div');
      t.className = 'cz-title';
      t.textContent = '▪ 词语运用（造句是老师的话；原句逐字来自本课课文，点击即可听）';
      cz.appendChild(t);
      g.cz.forEach(function(it){
        var item = document.createElement('div');
        item.className = 'cz-item';
        /* 词名 */
        var w = document.createElement('span');
        w.className = 'cz-w';
        w.textContent = it.w;
        w.onclick = function(){ speak(it.w); };
        item.appendChild(w);
        /* 造句行（老师的话，橙） */
        var made = document.createElement('div');
        made.className = 'cz-line made';
        made.innerHTML = '<span class="tag">造句</span>' + it.made;
        made.onclick = function(){ speak(it.made); };
        item.appendChild(made);
        /* 原句行（课文原文，绿；目标词标红） */
        var orig = document.createElement('div');
        orig.className = 'cz-line orig';
        var marked = it.orig.split(it.w).join('<span class="hot">' + it.w + '</span>');
        orig.innerHTML = '<span class="tag">原句</span><span>' + marked + '</span>' +
                         '<span class="src">课文第' + g.no + '课</span>';
        orig.onclick = function(){ speak(cleanSay(it.orig)); };
        item.appendChild(orig);
        cz.appendChild(item);
      });
      box.appendChild(cz);
    }
  });

  /* 控制台核对用：词数与字数 */
  window.__czStat = { words: wordCount, chars: charCount };
})();

/* ---- 朗读稿清洗：去引号、省略号（与其余课件 data-say 禁令一致） ---- */
function cleanSay(t){
  return t.replace(/[“”‘’]/g, '').replace(/……/g, '');
}

/* ---- 点读（与其余课件同一套 speechSynthesis） ---- */
function speak(t){
  if (!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }catch(e){}
}
</script>
